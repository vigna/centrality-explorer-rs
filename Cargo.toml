[package]
name = "centrality-explorer"
version = "0.1.2"
edition = "2024"
description = "Visual explorer for centrality measures"
authors = ["Sebastiano Vigna <sebastiano.vigna@unimi.it>"]
repository = "https://github.com/vigna/centrality-explorer-rs"
license = "Apache-2.0 OR MIT"
readme = "README.md"
categories = ["visualization", "mathematics", "gui"]
keywords = ["centrality", "pagerank", "graphs", "network-analysis"]
exclude = ["docs/", "*.pdf"]
documentation = "https://docs.rs/centrality-explorer"
rust-version = "1.95"

[dependencies]
anyhow = "1"
eframe = "0.37"
egui = "0.37"
egui_plot = "0.38"
rand = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
js-sys = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
