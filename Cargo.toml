[package]
name = "pagerank-explorer"
version = "0.1.0"
edition = "2024"
description = "A teaching aid to build intuition about PageRank as a function of the damping factor"
license = "Apache-2.0 OR LGPL-2.1-or-later"
readme = "README.md"
authors = ["Sebastiano Vigna <sebastiano.vigna@unimi.it>"]

[dependencies]
anyhow = "1"
eframe = "0.37"
egui = "0.37"
egui_plot = "0.38"
rand = "0.10"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[dev-dependencies]
tempfile = "3"
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
