name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Read the wasm-bindgen version from Cargo.lock
        id: bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/[^0-9.]/, ""); print; exit}' Cargo.lock)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ steps.bindgen.outputs.version }}
      - name: Install wasm-bindgen-cli
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version ${{ steps.bindgen.outputs.version }} --locked
      - run: sh web/build.sh
      - run: mkdir site && cp dist/centrality-explorer.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
